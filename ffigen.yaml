# Run with `dart run ffigen --config ffigen.yaml`.
name: FlareBindings
description: |
  Bindings to Flare Document Database.
output: 'lib/flare_bindings_generated.dart'
headers:
  entry-points:
    - 'src/flare.h'
  include-directives:
    - 'src/flare.h'
preamble: |
  // ignore_for_file: always_specify_types
  // ignore_for_file: camel_case_types
  // ignore_for_file: non_constant_identifier_names
comments:
  style: any
  length: full
