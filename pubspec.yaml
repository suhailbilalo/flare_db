name: flare_db
description: A high-performance, Firebase-style Document Database optimized for Android 15. Features AES-256 encryption, crash resilience, and multi-thread support.
version: 0.0.1-beta.2
homepage: https://github.com/suhailbilalo/flare_db
repository: https://github.com/suhailbilalo/flare_db
issue_tracker: https://github.com/suhailbilalo/flare_db/issues

environment:
  sdk: ^3.13.2

dependencies:
  code_assets: ^1.1.0
  ffi: ^2.1.4
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.0
  uuid: ^4.0.0

dev_dependencies:
  ffigen: ^21.0.0
  flutter_lints: ^6.0.0
  test: ^1.28.0
